name: docs

# Builds the documentation site (mkdocs + Material + mkdocstrings) from this
# repository and publishes it to GitHub Pages at https://locusagents.oracle.com/.
# The API reference imports the installed SDK, so the build installs this
# checkout (core + security add-on + docs toolchain) first; the build hooks in
# hooks/ read the SDK version and provider registry from that install.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "overrides/**"
      - "hooks/**"
      - "mkdocs.yml"
      - "src/locus/**/*.py"
      - "packages/locus-sdk-security/src/**/*.py"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "overrides/**"
      - "hooks/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # actions/checkout@v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0  # Needed by mkdocs-material for "last updated" timestamps.

      # actions/setup-python@v6.2.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
          cache: pip

      - name: Install locus, the security add-on and the docs toolchain
        run: |
          pip install -U pip
          pip install -e ".[docs,oci,oracledb,openai]" -e "packages/locus-sdk-security"

      - name: Build mkdocs site (strict)
        run: mkdocs build --strict

      # actions/upload-pages-artifact@v3
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # actions/deploy-pages@v4
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
