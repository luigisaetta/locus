  <g class="node"><rect x="406" y="595" width="128" height="26" rx="8"/><text class="sub" x="470" y="608">skills.activated</text></g>

  <text class="note" x="470" y="652">Dashed: ModelChunkEvent only with stream_tokens=True; ModelCompleteEvent is bridged but never yielded by Agent.run.</text>
  <text class="note" x="470" y="670">Each lane shows representative names. Below agent.*, the subsystems publish straight through emit() or emit_sync().</text>
  <text class="note" x="470" y="688">Built-in hooks also publish under agent.*. With no run id bound, emit() returns at once and nothing is published.</text>
</svg>
