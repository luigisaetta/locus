<text class="note" x="148" y="312">Each output, plus the task, prompts the next</text>
<text class="note" x="148" y="331">agent. The last output is the result.</text>
<text class="note" x="460" y="312">Every agent gets the same task at once;</text>
<text class="note" x="460" y="331">the outputs are joined into one result.</text>
<text class="note" x="772" y="312">Re-prompts the agent with its own output</text>
<text class="note" x="772" y="331">until the condition holds, or max_loops.</text>
<text class="note" x="148" y="674">Its model routes subtasks to the specialists</text>
<text class="note" x="148" y="693">it picks, then correlates and summarizes.</text>
<text class="note" x="460" y="674">No router: each agent claims queued tasks</text>
<text class="note" x="460" y="693">its tags match, and shares what it finds.</text>
<text class="note" x="772" y="674">Carries a summary, not the full transcript;</text>
<text class="note" x="772" y="693">the number of hand-offs is capped.</text>
<text class="note" x="148" y="1036">Nodes update shared state; a router picks</text>
<text class="note" x="148" y="1055">the next node. Loops stop at max_iterations.</text>
<text class="note" x="460" y="1036">Plain async functions: @task can add retries</text>
<text class="note" x="460" y="1055">and caching; fan out with asyncio.gather.</text>
<text class="note" x="772" y="1036">A2AServer serves an AgentCard; clients in</text>
<text class="note" x="772" y="1055">any process or runtime call it over HTTP.</text>
</svg>
