<!--
  The multi-agent shapes, one panel each, as the code routes them (src/locus):
    Sequential    agent/composition.py:88   agents run in order; each later prompt is
                                            prompt_template(previous output, task); the last output is the result
    Parallel      agent/composition.py:191  every agent gets the same task (task_map can override),
                                            run with asyncio.gather; outputs concatenated (or "last")
    Loop          agent/composition.py:268  one agent re-run with loop_prompt(previous output) until
                                            condition(output) is true or max_loops is reached
    Orchestrator  multiagent/orchestrator.py:350  its model picks any subset of specialists + subtasks
                                            (:167; all of them only when there is no model, :169), they run in
                                            parallel (semaphore-capped), then it correlates and summarizes
    Swarm         multiagent/swarm.py:399   no router: agents claim pending tasks from a priority queue
                                            when their capability tags match, read SharedContext and write
                                            findings / blackboard back to it (swarm.py:232, :270)
    Handoff       multiagent/handoff.py:366 the target receives a HandoffContext: task, conversation
                                            summary (each message cut to 200 chars, :353), findings; never the
                                            full transcript: preserve_full_history adds only the system message
                                            + last 5 (:328, :420); handoffs capped by max_handoff_chain (:470)
    StateGraph    multiagent/graph.py:928   next node = Command(goto) if returned, else the conditional
                                            router, else plain edges; runs until END or max_iterations (:1049)
    Functional    multiagent/functional.py  an @entrypoint function awaits @task functions (retries, cache)
    A2A           a2a/protocol.py:1039      A2AClient reads /.well-known/agent-card.json, then sends
                                            JSON-RPC: message/send returns a Task (:1117, server :830);
                                            message/stream answers as SSE (:1135, server :846)
  Styled by the .tl-dia classes in docs/stylesheets/locus.css; see docs/diagrams/README.md.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 1070" role="img" aria-labelledby="title desc">
  <title id="title">Multi-agent shapes</title>
  <desc id="desc">Nine panels, one per shape. Sequential: Research, Write and Edit run in order, each output prompting the next, and the last output is the result. Parallel: one task goes to three agents at once and their outputs are joined into one result. Loop: an Editor runs a pass and, while its condition is not met, is re-prompted with its own output; once it is met, or at max_loops, that output is the result. Orchestrator and Specialists: the orchestrator routes subtasks to the specialists it picks (it can leave any of them out, as the dashed one shows), then correlates their findings into a summary. Swarm: with no router, agents claim tasks from a priority task queue when their tags match, and read and write a SharedContext of findings and a blackboard. Handoff: a Triage agent passes a HandoffContext holding the task, a conversation summary and findings, not the full transcript, to a Billing agent, and the number of hand-offs is capped. StateGraph: Draft updates shared state, then Review's router sends the work back to Draft to revise or on to END once approved; loops stop at max_iterations. Functional API: an @entrypoint function awaits @task functions, which can add retries and caching. A2A: an A2AClient in one process sends JSON-RPC to an A2AServer in another and gets a result back, or an SSE stream when it asks for a streamed reply; the server publishes an AgentCard and runs the Agent.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="arrowhead" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

