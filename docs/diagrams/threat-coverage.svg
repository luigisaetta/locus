<?xml version="1.0" encoding="UTF-8"?>
<!--
  Threat coverage, as encoded by locus.control.taxonomy and packages/locus-sdk-security/examples/scenarios:
    OwaspLLM (LLM01-LLM10), OwaspASI (ASI01-ASI10) and AtlasTechnique (a representative
    subset of MITRE ATLAS)   -> every ID is covered by at least one scenario gist
    a gist                   -> states one threat and the IDs it covers, shows the unsafe
                                attempt, shows the defense stopping it; the defense is a
                                primitive (GuardrailsHook, is_safe_url / safe_resolve,
                                ground_finding / ground_fingerprint), a pattern (allowlist /
                                audit), or both
    run_all.py               -> runs every gist under the mock model, exits non-zero if any fails
  Recording a result is a separate, optional step (locus.control.grounded.ground_finding):
    proceed                  -> Evidence; its taxonomy field is optional (default []) and can carry the same IDs
    regenerate / replan      -> Abstention
  Not every gist records one: guardrail gists block or redact, grounding gists abstain.
  Styled by the .tl-dia classes in docs/stylesheets/locus.css; see docs/diagrams/README.md.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 454" role="img" aria-labelledby="title desc">
  <title id="title">Threat coverage</title>
  <desc id="desc">Three threat catalogues are encoded as enums: the OWASP Top 10 for LLM Applications, the OWASP Top 10 for Agentic Applications, and a representative subset of MITRE ATLAS. Every ID in them leads to at least one scenario gist that runs offline with no credentials. A gist states one threat and the IDs it covers, shows an agent making the unsafe attempt, and shows the Locus defense stopping it, using a built-in primitive, an allowlist or audit pattern, or both. run_all.py runs every gist and passes only if all of them pass. To record a result, pass it through ground_finding: if its score clears the threshold, the decision is proceed and it ships as an Evidence, which can be tagged with the same IDs; below the threshold it is withheld as an Abstention that says why.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="arrowhead" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <!-- the gist: one threat, the attempt, the defense -->
  <g class="lane">
    <rect x="262" y="56" width="678" height="122" rx="14"/>
    <text class="lane-title" x="280" y="80">Scenario gist · runs offline, no credentials</text>
  </g>

  <!-- catalogues -> the gist's threat: the three edges merge into one -->
  <path class="edge" d="M220,49 C244,49 234,123 258,123"/>
  <path class="edge" d="M220,197 C244,197 234,123 258,123"/>
  <path class="edge" marker-end="url(#ah)" d="M220,123 L278,123"/>

  <!-- inside the gist -->
  <path class="edge" marker-end="url(#ah)" d="M430,123 L489,123"/>
  <path class="edge" marker-end="url(#ah)" d="M651,123 L710,123"/>

  <!-- run_all.py -> every gist -->
  <path class="edge" marker-end="url(#ah)" d="M355,254 L355,180"/>
  <rect class="label-bg" x="365" y="189" width="112" height="20" rx="4"/>
  <text class="label" x="421" y="199">runs every gist</text>

  <!-- defense -> ground_finding: optional, to record the result -->
  <path class="edge dashed" marker-end="url(#ah)" d="M817,152 L817,202 C817,212 810,218 800,218 L588,218 C578,218 571,224 571,234 L571,252"/>
  <rect class="label-bg" x="646" y="189" width="92" height="20" rx="4"/>
  <text class="label" x="692" y="199">to record it</text>

  <!-- ground_finding -> Evidence -->
  <path class="edge" marker-end="url(#ah)" d="M651,283 L734,283"/>
  <rect class="label-bg" x="660" y="294" width="64" height="20" rx="4"/>
  <text class="label" x="692" y="304">proceed</text>

  <!-- ground_finding -> Abstention -->
  <path class="edge" marker-end="url(#ah)" d="M571,312 L571,349 C571,363 581,371 595,371 L734,371"/>
  <rect class="label-bg" x="606" y="382" width="116" height="20" rx="4"/>
  <text class="label" x="664" y="392">below threshold</text>

  <g class="node">
    <rect x="20" y="20" width="200" height="58" rx="12"/>
    <text x="120" y="39">OWASP LLM Top 10</text>
    <text class="sub" x="120" y="60">OwaspLLM · LLM01–LLM10</text>
  </g>
  <g class="node">
    <rect x="20" y="94" width="200" height="58" rx="12"/>
    <text x="120" y="113">OWASP ASI Top 10</text>
    <text class="sub" x="120" y="134">OwaspASI · ASI01–ASI10</text>
  </g>
  <g class="node">
    <rect x="20" y="168" width="200" height="58" rx="12"/>
    <text x="120" y="187">MITRE ATLAS</text>
    <text class="sub" x="120" y="208">AtlasTechnique · subset</text>
  </g>

  <g class="node">
    <rect x="280" y="94" width="150" height="58" rx="12"/>
    <text x="355" y="113">Threat stated</text>
    <text class="sub" x="355" y="134">the IDs it covers</text>
  </g>
  <g class="node">
    <rect x="491" y="94" width="160" height="58" rx="12"/>
    <text x="571" y="113">Agent hits it</text>
    <text class="sub" x="571" y="134">the unsafe attempt</text>
  </g>
  <g class="node primary">
    <rect x="712" y="94" width="210" height="58" rx="12"/>
    <text x="817" y="113">Defense stops it</text>
    <text class="sub" x="817" y="134">primitive · pattern · both</text>
  </g>

  <g class="node">
    <rect x="280" y="254" width="150" height="58" rx="12"/>
    <text x="355" y="273">run_all.py</text>
    <text class="sub" x="355" y="294">all must pass</text>
  </g>
  <g class="node optional">
    <rect x="491" y="254" width="160" height="58" rx="12"/>
    <text x="571" y="273">ground_finding()</text>
    <text class="sub" x="571" y="294">score ≥ threshold?</text>
  </g>
  <g class="node allow">
    <rect x="736" y="254" width="186" height="58" rx="12"/>
    <text x="829" y="273">Evidence ships</text>
    <text class="sub" x="829" y="294">allow · can carry IDs</text>
  </g>
  <g class="node abstain">
    <rect x="736" y="342" width="186" height="58" rx="12"/>
    <text x="829" y="361">Abstention</text>
    <text class="sub" x="829" y="382">abstain · says why</text>
  </g>

  <text class="note" x="480" y="438">Every taxonomy ID has at least one gist, and an Evidence you record can carry those same IDs.</text>
</svg>
