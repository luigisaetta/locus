<?xml version="1.0" encoding="UTF-8"?>
<!--
  Tools and MCP card: the Agent calls a @tool function in its own process (solid
  edge) and an MCP server in another process (dashed edge across the boundary).
  MCPClient.load_tools wraps the server's tools as Tool objects, so the tool loop
  treats both the same way; only the call path differs.
  locus/tools/decorator.py: tool, Tool; locus/agent/agent.py: Agent(tools=…)
  locus/integrations/fastmcp.py: MCPClient.load_tools, MCPClient.call_tool, LocusMCPServer
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 56">
  <title>An agent with a tool in its own process and a dashed call across a process boundary to an MCP server</title>
  <defs><marker id="ah" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path class="arrowhead" d="M0,0 L6,3 L0,6 z"/></marker></defs>
  <path class="divider" d="M63.5,4 L63.5,52"/>
  <g class="node primary"><rect x="4" y="27" width="22" height="14" rx="3"/></g>
  <path class="edge" marker-end="url(#ah)" d="M26,34 L33,34"/>
  <g class="node"><rect x="35" y="27" width="22" height="14" rx="3"/></g>
  <path class="edge dashed" marker-end="url(#ah)" d="M15,27 L15,15 L81,15 L81,25"/>
  <g class="node"><rect x="70" y="27" width="22" height="14" rx="3"/></g>
</svg>
