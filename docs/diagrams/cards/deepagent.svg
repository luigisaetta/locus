<?xml version="1.0" encoding="UTF-8"?>
<!--
  DeepAgent card: create_deepagent runs one tool loop whose turns plan
  (write_todos, reflexion), explore (tools, subagents, datastores), validate
  (grounding against tool evidence) and report (the submit tool). The subject
  is the store of findings the loop writes and reads back through its
  filesystem tools: StateBackend in memory by default, FilesystemBackend on
  disk. The return edge is dashed because the loop closes conditionally: in
  create_research_workflow, route_after_grounding runs another pass
  (regenerate, then replan back into execute) only while the grounding score
  is below threshold and retries remain; otherwise END.
  locus/deepagent/factory.py: create_deepagent
  locus/deepagent/workflow.py: create_research_workflow, route_after_grounding
  locus/deepagent/backends/: BackendProtocol, StateBackend, FilesystemBackend
  Cylinder caps are cubic curves, not arcs: the glyph lint reads every number
  in d literally and an arc's 0 flags would read as an out-of-bounds point.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 56">
  <title>Four phases in a cycle around the findings store</title>
  <defs><marker id="ah" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path class="arrowhead" d="M0,0 L6,3 L0,6 z"/></marker></defs>
  <g class="node"><rect x="4" y="4" width="22" height="14" rx="3"/></g>
  <path class="edge" marker-end="url(#ah)" d="M26,11 L68,11"/>
  <g class="node"><rect x="70" y="4" width="22" height="14" rx="3"/></g>
  <path class="edge" marker-end="url(#ah)" d="M81,18 L81,36"/>
  <g class="node"><rect x="70" y="38" width="22" height="14" rx="3"/></g>
  <path class="edge" marker-end="url(#ah)" d="M70,45 L28,45"/>
  <g class="node"><rect x="4" y="38" width="22" height="14" rx="3"/></g>
  <path class="edge dashed" marker-end="url(#ah)" d="M15,38 L15,20"/>
  <g class="store primary"><path d="M37,24.5 C37,20.5 59,20.5 59,24.5 L59,31.5 C59,35.5 37,35.5 37,31.5 Z M59,24.5 C59,28.5 37,28.5 37,24.5"/></g>
</svg>
