<?xml version="1.0" encoding="UTF-8"?>
<!--
  The exception hierarchy in locus.core.errors (v2.16.0). Every class sets a
  class-level `kind` string; that string, not the class name, is the stable key.
    LocusError                        locus_error
      ToolError                       tool_error
        ToolNotFoundError             tool_not_found
        ToolValidationError           tool_validation
        ToolExecutionError            tool_execution
      ModelError                      model_error      (also carries .reason)
        ModelAuthError                model_auth
        ModelThrottledError           model_throttled
        ModelResponseError            model_response
      CheckpointError                 checkpoint_error
        CheckpointNotFoundError       checkpoint_not_found
        CheckpointSerializationError  checkpoint_serialization
      RAGError                        rag_error
        EmbeddingError                embedding_error
        VectorStoreError              vector_store_error
      ValidationError                 validation_error
      ConfigError                     config_error
      GSARValidationError             gsar_validation_error  (raised only when
                                      GSARConfig.fail_on_low_score is set)
  Arrows point from a class to its subclass. No other module subclasses these.
  Styled by the .tl-dia classes in docs/stylesheets/locus.css; see docs/diagrams/README.md.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 948 598" role="img" aria-labelledby="title desc">
  <title id="title">The Locus error hierarchy</title>
  <desc id="desc">LocusError, kind locus_error, is the root of the hierarchy in locus.core.errors, so catching it catches every class shown here. Its direct subclasses are ToolError, ModelError, CheckpointError, RAGError, ValidationError, ConfigError and GSARValidationError. ToolError, kind tool_error, has ToolNotFoundError (tool_not_found), ToolValidationError (tool_validation) and ToolExecutionError (tool_execution). ModelError, kind model_error, has ModelAuthError (model_auth), ModelThrottledError (model_throttled) and ModelResponseError (model_response). CheckpointError, kind checkpoint_error, has CheckpointNotFoundError (checkpoint_not_found) and CheckpointSerializationError (checkpoint_serialization). RAGError, kind rag_error, has EmbeddingError (embedding_error) and VectorStoreError (vector_store_error). ValidationError (validation_error), ConfigError (config_error) and GSARValidationError (gsar_validation_error) have no subclasses. Catching a class also catches all of its subclasses.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="arrowhead" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <!-- trunk: LocusError to its direct subclasses -->
  <path class="edge" marker-end="url(#ah)" d="M428,74 V541 Q428,547 434,547 H452"/>
  <path class="edge" marker-end="url(#ah)" d="M428,171 H452"/>
  <path class="edge" marker-end="url(#ah)" d="M428,311 H452"/>
  <path class="edge" marker-end="url(#ah)" d="M428,419 H452"/>
  <path class="edge" marker-end="url(#ah)" d="M428,483 H452"/>
  <path class="edge" marker-end="url(#ah)" d="M428,94 H36 Q30,94 30,100 V401 Q30,407 36,407 H54"/>
  <path class="edge" marker-end="url(#ah)" d="M30,203 H54"/>

  <!-- families: each base class to its subclasses -->
  <path class="edge" marker-end="url(#ah)" d="M176,203 H218"/>
  <path class="edge" marker-end="url(#ah)" d="M190,203 V145 Q190,139 196,139 H218"/>
  <path class="edge" marker-end="url(#ah)" d="M190,203 V261 Q190,267 196,267 H218"/>
  <path class="edge" marker-end="url(#ah)" d="M176,407 H218"/>
  <path class="edge" marker-end="url(#ah)" d="M190,407 V349 Q190,343 196,343 H218"/>
  <path class="edge" marker-end="url(#ah)" d="M190,407 V465 Q190,471 196,471 H218"/>
  <path class="edge" d="M634,171 H648"/>
  <path class="edge" marker-end="url(#ah)" d="M648,171 V145 Q648,139 654,139 H676"/>
  <path class="edge" marker-end="url(#ah)" d="M648,171 V197 Q648,203 654,203 H676"/>
  <path class="edge" d="M634,311 H648"/>
  <path class="edge" marker-end="url(#ah)" d="M648,311 V285 Q648,279 654,279 H676"/>
  <path class="edge" marker-end="url(#ah)" d="M648,311 V337 Q648,343 654,343 H676"/>

  <g class="node primary">
    <rect x="353" y="20" width="150" height="54" rx="12"/>
    <text x="428" y="37">LocusError</text>
    <text class="sub" x="428" y="58">locus_error</text>
  </g>

  <g class="node">
    <rect x="220" y="112" width="180" height="54" rx="12"/>
    <text x="310" y="129">ToolNotFoundError</text>
    <text class="sub" x="310" y="150">tool_not_found</text>
  </g>
  <g class="node">
    <rect x="220" y="176" width="180" height="54" rx="12"/>
    <text x="310" y="193">ToolValidationError</text>
    <text class="sub" x="310" y="214">tool_validation</text>
  </g>
  <g class="node">
    <rect x="220" y="240" width="180" height="54" rx="12"/>
    <text x="310" y="257">ToolExecutionError</text>
    <text class="sub" x="310" y="278">tool_execution</text>
  </g>
  <g class="node">
    <rect x="56" y="176" width="120" height="54" rx="12"/>
    <text x="116" y="193">ToolError</text>
    <text class="sub" x="116" y="214">tool_error</text>
  </g>
  <g class="node">
    <rect x="220" y="316" width="180" height="54" rx="12"/>
    <text x="310" y="333">ModelAuthError</text>
    <text class="sub" x="310" y="354">model_auth</text>
  </g>
  <g class="node">
    <rect x="220" y="380" width="180" height="54" rx="12"/>
    <text x="310" y="397">ModelThrottledError</text>
    <text class="sub" x="310" y="418">model_throttled</text>
  </g>
  <g class="node">
    <rect x="220" y="444" width="180" height="54" rx="12"/>
    <text x="310" y="461">ModelResponseError</text>
    <text class="sub" x="310" y="482">model_response</text>
  </g>
  <g class="node">
    <rect x="56" y="380" width="120" height="54" rx="12"/>
    <text x="116" y="397">ModelError</text>
    <text class="sub" x="116" y="418">model_error</text>
  </g>
  <g class="node">
    <rect x="678" y="112" width="240" height="54" rx="12"/>
    <text x="798" y="129">CheckpointNotFoundError</text>
    <text class="sub" x="798" y="150">checkpoint_not_found</text>
  </g>
  <g class="node">
    <rect x="678" y="176" width="240" height="54" rx="12"/>
    <text x="798" y="193">CheckpointSerializationError</text>
    <text class="sub" x="798" y="214">checkpoint_serialization</text>
  </g>
  <g class="node">
    <rect x="454" y="144" width="180" height="54" rx="12"/>
    <text x="544" y="161">CheckpointError</text>
    <text class="sub" x="544" y="182">checkpoint_error</text>
  </g>
  <g class="node">
    <rect x="678" y="252" width="240" height="54" rx="12"/>
    <text x="798" y="269">EmbeddingError</text>
    <text class="sub" x="798" y="290">embedding_error</text>
  </g>
  <g class="node">
    <rect x="678" y="316" width="240" height="54" rx="12"/>
    <text x="798" y="333">VectorStoreError</text>
    <text class="sub" x="798" y="354">vector_store_error</text>
  </g>
  <g class="node">
    <rect x="454" y="284" width="180" height="54" rx="12"/>
    <text x="544" y="301">RAGError</text>
    <text class="sub" x="544" y="322">rag_error</text>
  </g>
  <g class="node">
    <rect x="454" y="392" width="180" height="54" rx="12"/>
    <text x="544" y="409">ValidationError</text>
    <text class="sub" x="544" y="430">validation_error</text>
  </g>
  <g class="node">
    <rect x="454" y="456" width="180" height="54" rx="12"/>
    <text x="544" y="473">ConfigError</text>
    <text class="sub" x="544" y="494">config_error</text>
  </g>
  <g class="node">
    <rect x="454" y="520" width="180" height="54" rx="12"/>
    <text x="544" y="537">GSARValidationError</text>
    <text class="sub" x="544" y="558">gsar_validation_error</text>
  </g>

  <text class="note" x="228" y="528">Arrows point from a class to its subclasses;</text>
  <text class="note" x="228" y="546">catching a class also catches its subclasses.</text>
  <text class="note" x="228" y="568">Under each name is its kind, the stable key.</text>
</svg>
