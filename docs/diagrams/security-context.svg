<?xml version="1.0" encoding="UTF-8"?>
<!--
  SecurityContext, as built by locus_security.context (v2.16.0):
    SecurityContext          a frozen dataclass with one field per port:
                             logs, endpoint, identity, cloud, threat_intel, actions
    domain port -> provider  each field is a Protocol; its default_factory is the bundled reference
                             (_RefLogs, _RefEndpoint, _RefIdentity, _RefCloud, _RefThreatIntel),
                             or you inject your own per field: SecurityContext(logs=MyLogs())
    reference defaults       logs, endpoint, threat_intel return offline samples unless their env
                             vars are set; identity is always the offline sample; cloud wraps the
                             read-only AWS tools and returns available=False when boto3 is missing
    actions                  _RefActions(policy=ControlPolicy()):
                             execute(action, perform) -> admit() -> approve()
                               allow         -> perform() is awaited (the write fires)
                               require_human -> AdmissionError, nothing fires
                               deny          -> AdmissionError, nothing fires
                             request_approval() returns the decision without running anything
  Styled by the .tl-dia classes in docs/stylesheets/locus.css; see docs/diagrams/README.md.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 590" role="img" aria-labelledby="title desc">
  <title id="title">SecurityContext</title>
  <desc id="desc">SecurityContext is one handle with a port per security domain: ctx.logs for SIEM search, ctx.endpoint for EDR host forensics, ctx.identity for the identity provider, ctx.cloud for read-only control-plane evidence, and ctx.threat_intel for IOC enrichment. Each domain port is filled by the bundled reference provider by default, which returns an offline sample, or by a provider you write and inject for that one domain, such as SecurityContext(logs=…). The last port, ctx.actions, is the admission gate on ControlPolicy: when its policy allows an action, the side effect runs, such as identity.disable; when the policy holds or denies it, execute raises AdmissionError and nothing fires. The bundled cloud default is the read-only AWS provider, which reports itself unavailable without boto3.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="arrowhead" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <g class="lane">
    <rect x="228" y="12" width="680" height="390" rx="14"/>
    <text class="lane-title" x="250" y="38">DOMAIN PORTS</text>
  </g>
  <g class="lane">
    <rect x="228" y="416" width="680" height="130" rx="14"/>
    <text class="lane-title" x="250" y="442">RESPONSE ACTIONS</text>
  </g>

  <!-- handle -> every port -->
  <path class="edge" marker-end="url(#ah)" d="M184,219 L248,219"/>
  <path class="edge" marker-end="url(#ah)" d="M212,219 L212,91 Q212,83 220,83 L248,83"/>
  <path class="edge" marker-end="url(#ah)" d="M212,151 L248,151"/>
  <path class="edge" marker-end="url(#ah)" d="M212,287 L248,287"/>
  <path class="edge" marker-end="url(#ah)" d="M212,355 L248,355"/>
  <path class="edge" marker-end="url(#ah)" d="M212,219 L212,491 Q212,499 220,499 L248,499"/>

  <!-- every domain port -> one provider -->
  <path class="edge" d="M454,83 L478,83 Q486,83 486,91 L486,219"/>
  <path class="edge" d="M454,355 L478,355 Q486,355 486,347 L486,219"/>
  <path class="edge" d="M454,151 L486,151"/>
  <path class="edge" d="M454,287 L486,287"/>
  <path class="edge" d="M454,219 L522,219"/>
  <path class="edge" marker-end="url(#ah)" d="M522,219 C584,219 580,151 642,151"/>
  <rect class="label-bg on-lane" x="555" y="175" width="56" height="20" rx="4"/>
  <text class="label" x="583" y="185">default</text>
  <path class="edge dashed" marker-end="url(#ah)" d="M522,219 C584,219 580,287 642,287"/>
  <rect class="label-bg on-lane" x="551" y="243" width="64" height="20" rx="4"/>
  <text class="label" x="583" y="253">injected</text>

  <!-- actions: allow -> the side effect; hold or deny -> AdmissionError -->
  <path class="edge allow" marker-end="url(#ah)" d="M454,499 L492,499"/>
  <path class="edge" marker-end="url(#ah)" d="M420,468 C420,420 818,420 818,466"/>
  <rect class="label-bg on-lane" x="570" y="422" width="92" height="20" rx="4"/>
  <text class="label" x="616" y="432">hold or deny</text>

  <g class="node primary">
    <rect x="20" y="190" width="164" height="58" rx="12"/>
    <text x="102" y="209">SecurityContext</text>
    <text class="sub" x="102" y="230">one handle</text>
  </g>

  <g class="node">
    <rect x="250" y="54" width="204" height="58" rx="12"/>
    <text x="352" y="73">ctx.logs</text>
    <text class="sub" x="352" y="94">SIEM search</text>
  </g>
  <g class="node">
    <rect x="250" y="122" width="204" height="58" rx="12"/>
    <text x="352" y="141">ctx.endpoint</text>
    <text class="sub" x="352" y="162">EDR host forensics</text>
  </g>
  <g class="node">
    <rect x="250" y="190" width="204" height="58" rx="12"/>
    <text x="352" y="209">ctx.identity</text>
    <text class="sub" x="352" y="230">identity provider</text>
  </g>
  <g class="node">
    <rect x="250" y="258" width="204" height="58" rx="12"/>
    <text x="352" y="277">ctx.cloud</text>
    <text class="sub" x="352" y="298">control plane, read-only</text>
  </g>
  <g class="node">
    <rect x="250" y="326" width="204" height="58" rx="12"/>
    <text x="352" y="345">ctx.threat_intel</text>
    <text class="sub" x="352" y="366">IOC enrichment</text>
  </g>

  <g class="node">
    <rect x="644" y="122" width="240" height="58" rx="12"/>
    <text x="764" y="141">Bundled reference</text>
    <text class="sub" x="764" y="162">offline sample</text>
  </g>
  <g class="node optional">
    <rect x="644" y="258" width="240" height="58" rx="12"/>
    <text x="764" y="277">Your provider</text>
    <text class="sub" x="764" y="298">SecurityContext(logs=…)</text>
  </g>

  <g class="node">
    <rect x="250" y="470" width="204" height="58" rx="12"/>
    <text x="352" y="489">ctx.actions</text>
    <text class="sub" x="352" y="510">ControlPolicy() gate</text>
  </g>
  <g class="node allow">
    <rect x="494" y="470" width="220" height="58" rx="12"/>
    <text x="604" y="489">Side effect fires</text>
    <text class="sub" x="604" y="510">allow · e.g. identity.disable</text>
  </g>
  <g class="node">
    <rect x="748" y="470" width="140" height="58" rx="12"/>
    <text x="818" y="489">AdmissionError</text>
    <text class="sub" x="818" y="510">nothing fires</text>
  </g>

  <text class="note" x="460" y="574">The bundled cloud default is the read-only AWS provider; without boto3 it reports itself unavailable.</text>
</svg>
