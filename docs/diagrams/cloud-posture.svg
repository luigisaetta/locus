<?xml version="1.0" encoding="UTF-8"?>
<!--
  The cloud-posture agent, as built by locus_security:
    create_soc_analyst (soc.py)   -> create_deepagent with the core describe_oci, use_oci and submit_posture;
                                     the run ends when submit_posture succeeds with enough confidence
    use_oci (locus/tools/oci.py)  -> the operation must start with a read prefix (list_/get_/summarize_/...),
                                     checked before any call; a mutating operation returns status=error,
                                     which the model sees as the tool result
                                  -> a read runs as the profile named in SecurityControls and returns the response
    ground_report (soc.py)        -> called once by the caller after the run; grounds each proposed finding:
                                     grounded=True evidence -> grounded claims, grounded=False -> ungrounded
    ground_finding (grounded.py)  -> GSAR score >= controls.min_gsar  -> Evidence (ships)
                                     otherwise                         -> Abstention (kept, with a reason)
  describe_oci only introspects the installed OCI SDK, so it is not drawn.
  Styled by the .tl-dia classes in docs/stylesheets/locus.css; see docs/diagrams/README.md.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 462" role="img" aria-labelledby="title desc">
  <title id="title">The cloud-posture agent</title>
  <desc id="desc">In the agent, the SOC analyst makes tool calls through use_oci, which admits read operations only. A read is sent to the OCI APIs as the audit profile, which you point at a read-only IAM group as the hard backstop, and the response returns to the analyst as evidence; a write is refused before any call is made, and the refusal goes back to the analyst as an error. The analyst ends its run by submitting a PostureReport of proposed findings. After the run, ground_report scores each finding with GSAR: a finding whose score reaches min_gsar ships as a typed Evidence, and one below it abstains and is kept for audit. Direct API observations count as grounded evidence; an inference alone cannot ship a finding.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="arrowhead" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <g class="lane">
    <rect x="12" y="12" width="896" height="196" rx="14"/>
    <text class="lane-title" x="32" y="38">THE AGENT</text>
  </g>
  <g class="lane">
    <rect x="12" y="222" width="896" height="196" rx="14"/>
    <text class="lane-title" x="32" y="248">GROUNDING</text>
  </g>

  <!-- OCI APIs -> analyst: the response -->
  <path class="edge" marker-end="url(#ah)" d="M792,98 C792,40 150,40 150,96"/>
  <rect class="label-bg on-lane" x="380" y="44" width="182" height="20" rx="4"/>
  <text class="label" x="471" y="54">raw response, the evidence</text>

  <!-- analyst -> use_oci -->
  <path class="edge" marker-end="url(#ah)" d="M220,127 L338,127"/>
  <rect class="label-bg on-lane" x="245" y="138" width="68" height="20" rx="4"/>
  <text class="label" x="279" y="148">tool call</text>

  <!-- use_oci -> OCI APIs -->
  <path class="edge" marker-end="url(#ah)" d="M536,127 L698,127"/>
  <rect class="label-bg on-lane" x="585" y="138" width="64" height="20" rx="4"/>
  <text class="label" x="617" y="148">read op</text>

  <!-- use_oci -> analyst: a write is refused -->
  <path class="edge deny" marker-end="url(#ah)" d="M410,156 C410,196 200,196 200,158"/>
  <rect class="label-bg on-lane" x="255" y="176" width="100" height="20" rx="4"/>
  <text class="label" x="305" y="186">write: refused</text>

  <!-- analyst -> PostureReport -->
  <path class="edge" marker-end="url(#ah)" d="M128,156 L128,291"/>
  <rect class="label-bg on-lane" x="74" y="176" width="108" height="20" rx="4"/>
  <text class="label" x="128" y="186">submit_posture</text>

  <!-- PostureReport -> ground_report -->
  <path class="edge" marker-end="url(#ah)" d="M220,322 L338,322"/>
  <rect class="label-bg on-lane" x="233" y="333" width="92" height="20" rx="4"/>
  <text class="label" x="279" y="343">after the run</text>

  <!-- ground_report -> ship -->
  <path class="edge allow" marker-end="url(#ah)" d="M536,322 C620,322 614,278 698,278"/>
  <rect class="label-bg on-lane" x="561" y="281" width="112" height="20" rx="4"/>
  <text class="label" x="617" y="291">score ≥ min_gsar</text>

  <!-- ground_report -> abstain -->
  <path class="edge" marker-end="url(#ah)" d="M536,322 C620,322 614,366 698,366"/>
  <rect class="label-bg on-lane" x="561" y="343" width="112" height="20" rx="4"/>
  <text class="label" x="617" y="353">score &lt; min_gsar</text>

  <g class="node">
    <rect x="36" y="98" width="184" height="58" rx="12"/>
    <text x="128" y="117">SOC analyst</text>
    <text class="sub" x="128" y="138">create_soc_analyst()</text>
  </g>
  <g class="node">
    <rect x="340" y="98" width="196" height="58" rx="12"/>
    <text x="438" y="117">use_oci</text>
    <text class="sub" x="438" y="138">read operations only</text>
  </g>
  <g class="node">
    <rect x="700" y="98" width="184" height="58" rx="12"/>
    <text x="792" y="117">OCI APIs</text>
    <text class="sub" x="792" y="138">as your audit profile</text>
  </g>

  <g class="node">
    <rect x="36" y="293" width="184" height="58" rx="12"/>
    <text x="128" y="312">PostureReport</text>
    <text class="sub" x="128" y="333">proposed findings</text>
  </g>
  <g class="node primary">
    <rect x="340" y="293" width="196" height="58" rx="12"/>
    <text x="438" y="312">ground_report()</text>
    <text class="sub" x="438" y="333">GSAR per finding</text>
  </g>
  <g class="node allow">
    <rect x="700" y="249" width="184" height="58" rx="12"/>
    <text x="792" y="268">Ship</text>
    <text class="sub" x="792" y="289">allow · typed Evidence</text>
  </g>
  <g class="node abstain">
    <rect x="700" y="337" width="184" height="58" rx="12"/>
    <text x="792" y="356">Abstain</text>
    <text class="sub" x="792" y="377">kept for audit</text>
  </g>

  <text class="note" x="460" y="446">Direct API observations count as grounded evidence; an inference alone cannot ship a finding.</text>
</svg>
