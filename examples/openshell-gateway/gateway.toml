# OpenShell gateway settings for examples/openshell-gateway/docker-compose.yml.
# Adapted from NVIDIA/OpenShell deploy/docker/gateway.toml (Apache-2.0,
# Copyright (c) 2025-2026 NVIDIA CORPORATION & AFFILIATES).
#
# grpc_endpoint is omitted on purpose: the Docker supervisor uses host
# networking and reaches the published port at http://127.0.0.1:8080, so keep
# OPENSHELL_PORT at 8080.

[openshell]
version = 2

[openshell.gateway]
bind_address        = "127.0.0.1:8080"
health_bind_address = "0.0.0.0:8081"   # container-wide so the published port answers
log_level           = "info"
compute_driver      = "docker"
disable_tls         = true

# Loopback only and no TLS: user calls are unauthenticated. Supervisors still
# authenticate with the JWT keys the compose init service writes.
[openshell.gateway.auth]
allow_unauthenticated_users = true

[openshell.gateway.gateway_jwt]
signing_key_path = "/var/lib/openshell/tls/jwt/signing.pem"
public_key_path  = "/var/lib/openshell/tls/jwt/public.pem"
kid_path         = "/var/lib/openshell/tls/jwt/kid"
gateway_id       = "openshell-locus"

[openshell.drivers.docker]
# Image a sandbox gets when the caller names none.
default_image         = "nvcr.io/nvidia/base/ubuntu:24.04"
# Images the gateway extracts the sandbox and supervisor binaries from.
sandbox_runtime_image = "ghcr.io/nvidia/openshell/sandbox:latest"
supervisor_image      = "ghcr.io/nvidia/openshell/supervisor:latest"
image_pull_policy     = "if_not_present"
sandbox_label         = "openshell"
# Supervisor-compatible default; use RuntimeDefault only where AppArmor exists.
app_armor_profile     = "Unconfined"
