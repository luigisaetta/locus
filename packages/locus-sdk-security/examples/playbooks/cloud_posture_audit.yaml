# Cloud posture audit — mirror of locus_security.cloud_posture_audit().
id: cloud_posture_audit
name: Cloud posture audit
description: >-
  Map the tenancy from the OCI SDK, gather read-only evidence, and submit
  a grounded posture report.
allow_extra_tools: true
tags: [cloud, posture, audit]
steps:
- id: discover
  description: Discover the tenancy's services, clients and read-only operations.
  expected_tools: [describe_oci]
- id: gather
  description: Gather evidence with read-only API calls.
  expected_tools: [use_oci]
  hints: [Cite the exact API fact behind every proposed finding.]
- id: report
  description: Submit the grounded posture report.
  expected_tools: [submit_posture]
