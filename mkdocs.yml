site_name: locus
site_description: "A policy gate, approvals and an audit trail for the actions Python agents take: every consequential action clears a policy you write before the side effect. Build on the full runtime, or put the gate around the agent you already have."
site_url: https://locusagents.oracle.com/
repo_url: https://github.com/oracle/locus
repo_name: oracle/locus
edit_uri: edit/main/docs/

docs_dir: docs
strict: true

exclude_docs: |
  internal/
  doc-gen/
  diagrams/README.md
  # Engineering notes that live next to the code they describe (linked from
  # the README and CHANGELOG on GitHub), not pages of the site.
  decision.md
  harness.md
  observation-pack.md
  pg-checkpointer.md
  runner.md

theme:
  name: material
  custom_dir: overrides
  logo: img/mark.svg
  favicon: img/mark.svg
  font:
    text: Inter
    code: JetBrains Mono
  palette:
  # Dark (slate) is the default (listed first). Each scheme shows the icon
  # for the OTHER mode — dark shows a sun (go light), light shows a moon.
  - scheme: slate
    primary: custom
    accent: custom
    toggle:
      icon: material/brightness-7
      name: Switch to light mode
  - scheme: default
    primary: custom
    accent: custom
    toggle:
      icon: material/brightness-4
      name: Switch to dark mode
  features:
  - navigation.instant
  - navigation.tabs
  - navigation.tabs.sticky
  - navigation.indexes
  - navigation.prune
  - navigation.top
  - content.code.copy
  - content.code.annotate
  - content.tabs.link
  - search.highlight
  - search.share
  - search.suggest

# Append a content hash to local CSS/JS URLs so browsers fetch fresh assets
# the moment a file changes (no more stale-cache surprises). See hooks/.
hooks:
- hooks/cache_bust.py
- hooks/build_metadata.py

extra_css:
- https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600..700&display=swap
- stylesheets/locus.css

extra_javascript:
- javascripts/header-home.js
- javascripts/action-demo.js
- javascripts/notebook-filter.js
- javascripts/sidebar-filter.js

copyright: <span class="footer-brand"><span class="footer-brand__text">Oracle Generative AI</span></span><br><span class="footer-copy">Copyright &copy; 2025&ndash;2026 Oracle and/or its affiliates &middot; <a href="/legal/">Legal &amp; disclaimer</a></span>

extra:
  homepage: https://locusagents.oracle.com/
  # The model every generic example uses. It matches the quickstart, which
  # installs only the openai extra. Change it here, not on the pages: the
  # build hook expands {{ locus_example_model }} everywhere.
  example_model: openai:gpt-4o-mini
  social:
  - icon: fontawesome/brands/github
    link: https://github.com/oracle/locus
    name: locus on GitHub
  - icon: fontawesome/brands/python
    link: https://pypi.org/project/locus-sdk/
    name: locus-sdk on PyPI
  generator: false

markdown_extensions:
- admonition
- attr_list
- md_in_html
- def_list
- footnotes
- pymdownx.details
- pymdownx.highlight:
    anchor_linenums: true
    line_spans: __span
    pygments_lang_class: true
- pymdownx.inlinehilite
# Notebook pages embed the notebooks source from the SDK repo: `.sdk` is
# where the deploy workflow checks it out, `../locus-sdk` the local
# convention (see README). check_paths makes a missing include fail the
# build instead of rendering an empty section.
- pymdownx.snippets:
    base_path: [., packages/locus-sdk-security]
    check_paths: true
# Mermaid diagrams render client-side via Material's built-in integration;
# the custom_fence is what routes ```mermaid to it instead of highlighting
# it as source. Required by docs/research/ and the concept diagrams.
- pymdownx.superfences:
    custom_fences:
    - name: mermaid
      class: mermaid
      format: !!python/name:pymdownx.superfences.fence_code_format
- pymdownx.tabbed:
    alternate_style: true
- pymdownx.emoji:
    emoji_index: !!python/name:material.extensions.emoji.twemoji
    emoji_generator: !!python/name:material.extensions.emoji.to_svg
- tables
- toc:
    permalink: true

plugins:
- search
- mkdocstrings:
    default_handler: python
    handlers:
      python:
        options:
          docstring_style: google
          show_source: true
          show_root_heading: true
          show_root_full_path: false
          separate_signature: true
          show_signature_annotations: true
          merge_init_into_class: true
          show_if_no_docstring: false
          inherited_members: true
          members_order: source

